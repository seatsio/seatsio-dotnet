name: 'Build'

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      httpbin:
        image: mccutchen/go-httpbin:2.25.0
        ports:
          - 8080:8080

    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 6.x
    - run: dotnet restore
    - uses: zcong1993/setup-timezone@master
      with:
        timezone: Europe/Brussels
    - run: dotnet test SeatsioDotNet.Test --verbosity normal
      env:
        API_URL: https://api-staging-na.seatsio.net
        HTTPBIN_URL: http://localhost:${{ job.services.httpbin.ports['8080'] }}
        CORE_V2_API_SECRET: ${{ secrets.CORE_V2_STAGING_NA_SYSTEM_API_SECRET }}
        USAGE_REPORTING_TESTS_API_URL: https://api-staging-eu.seatsio.net
        USAGE_REPORTING_TESTS_SECRET_KEY: ${{ secrets.DEMO_COMPANY_SECRET_KEY }}
